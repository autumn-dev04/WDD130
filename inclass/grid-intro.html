<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div{
            height: 200px;
            background-color: green;
            color: black;
            border: solid;
            border-color: black;
            text-align: center;
        }

        body {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 20px;
        }

        #first-div {
            background-color: darkblue;
            grid-column: 1/4;
        }

        div:nth-child(2) {
            background-color: blueviolet;
            grid-row: 2/4;
            height: 100%;
        }

    </style>
</head>
<!-- Always make the parent a grid so the child can move around the grid -->
<body>
    <div id ="first-div">1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
</body>
</html>
