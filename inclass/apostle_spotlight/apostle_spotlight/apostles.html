<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background-color: #E8ECED;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            text-align: center;
            justify-content: center;
        }

        #apostles-section {
            background-image: url("images/christus.webp");
            width: 1000px;
            height: 610px;
            border-style: solid;
            border-color: black;
            border-radius: 20px;
            border-width: 10px;
            justify-items: center;
        }

        #first-presidency {
            border-style: solid;
            border-color: white;
            border-radius: 50%;
            border-width: 10px;
        }

        #quorom-twelve {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
        }

        h1 {
            color: white;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        h2 {
            color: white;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        img {
            border-style: solid;
            border-color: white;
            border-radius: 50%;
            border-width: 10px;
            max-width: 60px;
        }

        img:hover {
            border-style: solid;
            border-color: gray;
            border-radius: 50%;
            border-width: 10px;
        }

        #oaks {
            border-style: solid;
            border-color: white;
            border-radius: 50%;
            border-width: 10px;
            max-width: 100px;
        }

        #oaks:hover {
            border-style: solid;
            border-color: gray;
            border-radius: 50%;
            border-width: 10px;
        }

        #eyring, #chris {
            max-width: 90px;
            border-style: solid;
            border-color: white;
            border-radius: 50%;
            border-width: 10px;
        }

        #eyring:hover {
            border-style: solid;
            border-color: gray;
            border-radius: 50%;
            border-width: 10px;
        }

        #chris:hover {
            border-style: solid;
            border-color: gray;
            border-radius: 50%;
            border-width: 10px;
        }

    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div id="apostles-section">
        <h1>First Presidency</h1>
        <div id="first=presidency">
            <img id="eyring" src="images/eyring.webp" alt="eyring">
            <img id="oaks" src="images/oaks.webp" alt="oaks">
            <img id="chris" src="images/christofferson.webp" alt="cristofferson">
        </div>
        <h2>Quorom of the Twelve Apostles</h2>
        <div id="quorom-twelve">
            <img id="uchtdorf" src="images/uchtdorf.webp" alt="uchtdorf">
            <img id="bednar" src="images/bednar.webp" alt="bednar">
            <img id="cook" src="images/cook.webp" alt="cook">
            <img id="anderson" src="images/anderson.webp" alt="anderson">
            <img id="rasband" src="images/rasband.webp" alt="rasband">
            <img id="stevenson" src="images/stevenson.webp" alt="stevenson">
            <img id="renlund" src="images/renlund.webp" alt="renlund">
            <img id="gong" src="images/gong.webp" alt="gong">
            <img id="soares" src="images/soares.webp" alt="soares">
            <img id="kearon" src="images/kearon.webp" alt="kearon">
            <img id="causse" src="images/causse.webp" alt="causse">
            <img id="gilbert" src="images/gilbert.webp" alt="gilbert">
        </div>
     </div>
</body>
</html>
